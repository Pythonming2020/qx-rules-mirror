#!name=知乎去广告 · 信息流 + 开屏
#!desc=feed 广告卡删除 + 冷启动开屏拦截。信息流用本地 v4 脚本（基于 8-22 日志实证），开屏用 community 实测端点。
#!author=local v4 + community endpoint
#!homepage=https://github.com/Pythonming2020/qx-rules-mirror
#!date=2026-09-30

[rewrite_local]

# ── 开屏广告（冷启动时请求 launch_v2 拿素材）──
# 来源：doabell.com 实测 + community 通用规则
^https?:\/\/api\.zhihu\.com\/commercial_api\/(real_time_)?launch_v2.* url reject

# 悬浮图标层 / 弹窗推广（同一目录，顺手拦）
^https?:\/\/api\.zhihu\.com\/commercial_api\/(app_float_layer|popovers).* url reject

# 服务器推送配置（可关掉广告推送）
^https?:\/\/appcloud2\.zhihu\.com\/v\d+\/config.* url reject

# ── 信息流广告卡（本地 v4 脚本）──
^https?:\/\/api\.zhihu\.com\/feed-root\/block url script-response-body https://raw.githubusercontent.com/Pythonming2020/qx-rules-mirror/main/zhihu_adkill_v4.js
^https?:\/\/api\.zhihu\.com\/(moments|topstory\/recommend).* url script-response-body https://raw.githubusercontent.com/Pythonming2020/qx-rules-mirror/main/zhihu_adkill_v4.js

[mitm]
hostname = api.zhihu.com, appcloud2.zhihu.com, page-info.zhihu.com, page-modular.zhihu.com
