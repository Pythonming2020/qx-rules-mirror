#!name=知乎去广告 · 覆盖规则（commercial_api 封死）
#!desc=西米露自有规则。30/09 debug 日志实证：real_time_launch_v2 被 NobyDa 老规则拦住，
#!     但 launch_v2 / banners_v3/…banner / real_time_pull_refresh_v2 三条漏网（连接复用致后续请求跳过匹配）。
#!     本文件置于 _custom/，不被 scripts/sync.py 覆盖（target_path 只映射 mirror/<owner>_<repo>/）。
#!     需在 QTX「资源」中订阅本文件，且排在 mirror/NobyDa_Script/Js.conf 之前。
#!date=2026-10-01

[rewrite_local]

# commercial_api 整段封死：开屏(launch_v2/real_time_launch_v2)、下拉刷新、顶部横幅、悬浮层
^https?:\/\/api\.zhihu\.com\/commercial_api\/.* url reject-200

# 服务器推送配置（广告推送）
^https?:\/\/appcloud2\.zhihu\.com\/v\d+\/config.* url reject-200

[mitm]
hostname = api.zhihu.com, appcloud2.zhihu.com, page-info.zhihu.com, page-modular.zhihu.com
