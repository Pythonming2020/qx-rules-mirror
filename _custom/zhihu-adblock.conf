#!name=知乎去广告 · 自持兜底规则
#!desc=西米露自有。不依赖上游 NobyDa/Script——mirror/ 下文件每天 05:00 被 sync.py 的
#!     fetch() 用 os.replace() 无条件覆盖，改不动也留不住。本文件在 _custom/，脚本不碰。
#!     作用：知乎广告端点整段封死。上游那条规则若因变动失效，本条兜底。
#!     订阅：本文件排在 mirror/NobyDa_Script/Js.conf 之前，先匹配先生效。
#!date=2026-10-02

[rewrite_local]

# ── 商业化 API 整段：开屏 / 下拉刷新 / 顶部横幅 / 悬浮层 ──
# 30/09 debug 日志实证覆盖：
#   commercial_api/launch_v2                   开屏
#   commercial_api/real_time_launch_v2         开屏
#   commercial_api/real_time_pull_refresh_v2
#   commercial_api/real_time_second_floor_v2
#   commercial_api/app_float_layer
#   commercial_api/banners_v3/app_topstory_banner
^https?:\/\/api\.zhihu\.com\/commercial_api\/.* url reject-200

# ── NobyDa 原规则的全部路径：上游删改后由本条接管 ──
^https?:\/\/api\.zhihu\.com\/(?:ad|drama|fringe|commercial|market\/popover|search\/(?:top|preset|tab)|.*featured-comment-ad).* url reject-200

# ── 服务器推送配置（广告开关下发）──
^https?:\/\/appcloud2\.zhihu\.com\/v\d+\/config.* url reject-200

[mitm]
hostname = api.zhihu.com, appcloud2.zhihu.com, page-info.zhihu.com, page-modular.zhihu.com